services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    # Inside Docker, reach MySQL on the host with host.docker.internal instead of 127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
