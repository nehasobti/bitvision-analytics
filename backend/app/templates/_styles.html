  <style>
    {% if simple_pdf %}
    {# xhtml2pdf fallback: no nested page-margin boxes #}
    @page { size: a4 landscape; margin: 14mm 12mm; }
    {% else %}
    @page { size: A4 landscape; margin: 14mm 12mm; @bottom-right { content: "{{ t('report.page') }} " counter(page) " {{ t('report.of') }} " counter(pages); font-size: 8pt; color: #666; } }
    {% endif %}
    body { font-family: Helvetica, Arial, sans-serif; font-size: 8.5pt; color: #1a1a1a; }
    h1 { font-size: 15pt; margin: 0 0 2mm; color: #1F4E79; }
    h2 { font-size: 11pt; margin: 6mm 0 2mm; color: #1F4E79; }
    .meta { color: #555; margin-bottom: 3mm; }
    .hint { color: #555; font-style: italic; margin: 0 0 2mm; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #1F4E79; color: #fff; text-align: left; padding: 3px 4px; font-weight: 600; }
    td { padding: 2.5px 4px; border-bottom: 0.5px solid #ddd; }
    tr:nth-child(even) td { background: #f5f8fb; }
    td.num, th.num { text-align: right; }
    tr.total td { font-weight: 700; border-top: 1px solid #1F4E79; background: #e8eef5; }
    table.filters { width: auto; }
    table.filters tr td { border: none; padding: 1px 16px 1px 0; background: none; }
  </style>
